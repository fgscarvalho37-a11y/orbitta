spring.application.name=orbitta-backend

# ===============================
# POSTGRESQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/orbitta
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# ORBITTA ADMIN
# ===============================
orbitta.admin.email=${ORBITTA_ADMIN_EMAIL:}
orbitta.admin.password=${ORBITTA_ADMIN_PASSWORD:}
orbitta.admin.first-name=${ORBITTA_ADMIN_FIRST_NAME:Orbitta}
orbitta.admin.last-name=${ORBITTA_ADMIN_LAST_NAME:Admin}

# ===============================
# MERCADO PAGO
# ===============================
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}

# URL do frontend para retorno após o checkout
orbitta.frontend-url=${ORBITTA_FRONTEND_URL:http://localhost:3000}