spring.application.name=orbitta-backend

# ===============================
# POSTGRESQL
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/orbitta}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SESSAO
# ===============================
spring.session.jdbc.initialize-schema=${SESSION_SCHEMA_INIT:always}
spring.session.jdbc.table-name=SPRING_SESSION
spring.session.timeout=30d

server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}

# ===============================
# SERVER
# ===============================
server.port=${PORT:8080}

# ===============================
# ORBITTA
# ===============================
orbitta.frontend-url=${ORBITTA_FRONTEND_URL:http://localhost:3000}
orbitta.cors.allowed-origins=${ORBITTA_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ===============================
# ORBITTA ADMIN
# ===============================
orbitta.admin.email=${ORBITTA_ADMIN_EMAIL:}
orbitta.admin.password=${ORBITTA_ADMIN_PASSWORD:}
orbitta.admin.first-name=${ORBITTA_ADMIN_FIRST_NAME:Orbitta}
orbitta.admin.last-name=${ORBITTA_ADMIN_LAST_NAME:Admin}

# ===============================
# MERCADO PAGO
# ===============================
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}

# ===============================
# STRIPE
# ===============================
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# ===============================
# PIZZASYSTEM INTEGRATION
# ===============================
pizzasystem.api-url=${PIZZASYSTEM_API_URL:}
orbitta.integration-secret=${ORBITTA_INTEGRATION_SECRET:}
